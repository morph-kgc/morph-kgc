[CONFIGURATION]
output_file=knowledge-graph.nt
output_format=N-TRIPLES

# The SPARQL endpoint the mapping reconciles against. Replace 'url' with the
# endpoint of your triplestore; 'username' and 'password' are only needed for
# access-controlled endpoints and read the environment when written as
# {ENV_VAR}. The endpoint is queried once, before any triple is generated.
[RESOURCE:disease_endpoint]
resource_type=SPARQL_ENDPOINT
url=http://127.0.0.1:8890/sparql
#username={ENDPOINT_USER}
#password={ENDPOINT_PASSWORD}
method=POST
matching=CASE-INSENSITIVE
# The SELECT query the index of concepts is built from. The endpoint holds more
# than the disease vocabulary, so the query keeps the index to the concepts of
# its concept scheme and to the labels written in English. Without this option,
# the SKOS labelling properties of every concept of the endpoint are indexed.
query=PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
    SELECT ?concept ?attribute ?value WHERE {
        ?concept skos:inScheme <https://example.org/vocabulary/disease> ;
                 ?attribute ?value .
        VALUES ?attribute { skos:prefLabel skos:altLabel }
        FILTER (lang(?value) = 'en')
    }

[PatientsDataSource]
mappings=mapping.ttl
