[CONFIGURATION]
output_file=knowledge-graph.nt
output_format=N-TRIPLES

[PatientsDataSource]
mappings=mapping.ttl

# The endpoint and the query are in the mapping, so nothing else is needed for an
# endpoint open to everyone. An access-controlled endpoint is declared with its
# credentials, which read the environment when written as {ENV_VAR}; 'url' is
# the endpoint the mapping names.
#[RESOURCE:clinical_trials]
#resource_type=SPARQL_ENDPOINT
#url=http://127.0.0.1:8890/sparql
#username={ENDPOINT_USER}
#password={ENDPOINT_PASSWORD}
