[CONFIGURATION]
output_file=knowledge-graph.nt
output_format=N-TRIPLES

# The module that hands out the tokens the mapping names. Morph-KGC calls its
# get_api_token(token_name) with the value of the header and sends the header
# with what it returns. Leave it out when the headers of the mapping are
# constants or '{ENV_VAR}' placeholders.
api_token=api_token.py

[ObservationsDataSource]
mappings=mapping.ttl
