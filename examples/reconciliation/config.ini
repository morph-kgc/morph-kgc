[CONFIGURATION]
output_file=knowledge-graph.nt
output_format=N-TRIPLES

# The SKOS vocabulary the mapping reconciles against. Replace 'url' with the
# URL (or file path) the vocabulary is published at; 'username' and 'password' are only needed
# for access-controlled vocabularies and read the environment when written as
# {ENV_VAR}. The vocabulary is fetched once, before any triple is generated.
[RESOURCE:disease_vocabulary]
resource_type=SKOS_VOCABULARY
url=disease_vocabulary.ttl
#username={VOCABULARY_USER}
#password={VOCABULARY_PASSWORD}

[PatientsDataSource]
mappings=mapping.ttl
