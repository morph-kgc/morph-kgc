[CONFIGURATION]

# INPUT
na_values=,#N/A,N/A,#N/A N/A,n/a,NA,<NA>,#NA,NULL,null,NaN,nan,None

# OUTPUT
output_file=knowledge-graph.nt
output_dir=
output_format=N-TRIPLES
safe_percent_encoding=

# MAPPINGS
mapping_partitioning=PARTIAL-AGGREGATIONS
infer_sql_datatypes=no

# MULTIPROCESSING
number_of_processes=

# FUNCTIONS
udfs=
# Directory the shared context of stateful functions is persisted to.
# Empty means a temporary directory, created and removed for every run.
state_dir=

# HTTP APIS
# Python module with a get_api_token(token_name) function handing out the
# tokens the headers of an HTTP API source name. Only needed for tokens that
# have to be asked for: a header value written as {ENV_VAR}, or as the name of
# an environment variable, is read from the environment without it.
api_token=

# LOGS
logging_level=INFO
logging_file=


[DataSource1]
mappings=/path/to/mapping/mapping_file.rml.ttl
#db_url=mysql+pymysql://user:password@localhost:3306/db_name


# Resources accessed by stateful functions. The mapping names the resource,
# while its location, credentials and access options are declared here.
#[RESOURCE:disease_vocabulary]
#resource_type=SKOS_VOCABULARY
#url=https://example.org/vocabulary/disease
#username={VOCABULARY_USER}
#password={VOCABULARY_PASSWORD}
#matching=CASE-INSENSITIVE

#[RESOURCE:reference_kg]
