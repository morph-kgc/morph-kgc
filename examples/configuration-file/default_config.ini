[CONFIGURATION]

# INPUT
na_values=,#N/A,N/A,#N/A N/A,n/a,NA,<NA>,#NA,NULL,null,NaN,nan,None

# OUTPUT
output_file=knowledge-graph.nt
output_dir=
output_format=N-TRIPLES
safe_percent_encoding=

# MAPPINGS
mapping_partitioning=PARTIAL-AGGREGATIONS
infer_sql_datatypes=no

# MULTIPROCESSING
number_of_processes=

# FUNCTIONS
udfs=
# Directory the shared contexts of stateful functions are written to during a
# run, e.g. on a disk with room for large contexts. Every run uses a directory
# of its own inside it, removed when the run ends, so it is not a cache reused
# across runs. Empty means the system temporary directory.
state_dir=
# Memory DuckDB may use in each process to build and read the on-disk tables of
# shared contexts, such as the indexes of the reconciliation functions, past
# which it spills to the state directory, e.g. 512MB or 2GB.
state_memory_limit=512MB

# HTTP APIS
# Python module with a get_api_token(token_name) function handing out the
# tokens the headers of an HTTP API source name. Only needed for tokens that
# have to be asked for: a header value written as {ENV_VAR}, or as the name of
# an environment variable, is read from the environment without it.
api_token=

# LOGS
logging_level=INFO
logging_file=


[DataSource1]
mappings=/path/to/mapping/mapping_file.rml.ttl
#db_url=mysql+pymysql://user:password@localhost:3306/db_name


# Resources accessed by stateful functions. The mapping names the resource,
# while its location, credentials and access options are declared here.
#[RESOURCE:disease_vocabulary]
#resource_type=SKOS_VOCABULARY
#url=https://example.org/vocabulary/disease
#username={VOCABULARY_USER}
#password={VOCABULARY_PASSWORD}

# A SPARQL endpoint a mapping sends a reconciliation query to is named by the
# mapping; it is only declared here when it needs credentials or access options.
#[RESOURCE:reference_kg]
#resource_type=SPARQL_ENDPOINT
#url=https://example.org/sparql
#username={ENDPOINT_USER}
#password={ENDPOINT_PASSWORD}
#method=POST
